[workspace]
name = "personal-slides"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = "==0.81.0"

[tasks]
preview = "quarto preview"
render = "bash scripts/render-site.sh"
restore = "Rscript scripts/restore-renv.R"
check = "Rscript scripts/check-environment.R"

[dependencies]
python = ">=3.12.14,<3.13"
# DALEX 1.7 still imports pkg_resources.
setuptools = ">=80,<81"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.3,<3"
polars = ">=1.44.2,<2"
statsmodels = ">=0.15.0,<0.16"
scipy = ">=1.18.1,<2"
scikit-learn = ">=1.9.1,<2"
# ArviZ plots 0.8 (required by Bambi 0.17) uses the pre-3.11 style API.
matplotlib = ">=3.10,<3.11"
shap = ">=0.52.0,<0.53"
seaborn = ">=0.13.2,<0.14"
xgboost = ">=3.4.1,<4"
lightgbm = ">=4.7.0,<5"
econml = ">=0.17.0,<0.18"
causal-learn = ">=0.1.4.7,<0.2"
causalml = ">=0.15.4,<0.16"
scikit-survival = ">=0.28.0,<0.29"

# R runtime; every additional R package is managed by renv.
r-base = "==4.5.3"
libopenblas = ">=0.3.34,<0.4"

# Notebook and editor executables
radian = ">=0.6.15,<0.7"
jedi = ">=0.20.0,<0.21"
ipykernel = ">=7.3.0,<8"
jupyter = ">=1.1.1,<2"
jupyter_core = ">=5.9.1,<6"
jupyter_client = ">=8.10.0,<9"

cmdstan = ">=2.39.0,<3"

quarto = ">=1.9.38,<2"

doubleml = ">=0.11.4,<0.12"

conda = ">=26.7.2,<27"
pymc = ">=5.28.5,<6"
nutpie = ">=0.16.11,<0.17"
bambi = ">=0.17.2,<0.18"
arviz = ">=0.23.4,<0.24"
numpyro = ">=0.21.0,<0.22"
blackjax = ">=1.6.2,<2"
arf = ">=0.5.1,<0.6"
dalex = ">=1.7.0,<2"
deno = ">=2.4.5,<2.5"
# Toolchain and system libraries used by renv source builds.
gcc_linux-64 = "14.*"
gxx_linux-64 = "14.*"
gfortran_linux-64 = "14.*"
make = "*"
cmake = "*"
pkg-config = "*"
libcurl = "*"
openssl = "*"
libxml2 = "*"
zlib = "*"
libpng = "*"
libjpeg-turbo = "*"
libtiff = "*"
libwebp = "*"
freetype = "*"
fontconfig = "*"
harfbuzz = "*"
fribidi = "*"
cairo = "*"
icu = "*"
nlopt = "*"
glpk = "*"
libuv = "*"
zeromq = "*"
expat = ">=2.8.5,<3"
libxml2-devel = ">=2.15.3,<3"

[activation.env]
RETICULATE_PYTHON = "$CONDA_PREFIX/bin/python"
RETICULATE_USE_MANAGED_VENV = "no"
JUPYTER_PATH = "$CONDA_PREFIX/share/jupyter"
QUARTO_DENO = "$CONDA_PREFIX/bin/deno"
QUARTO_SHARE_PATH = "$CONDA_PREFIX/share/quarto"
LANG = "ja_JP.UTF-8"
LC_ALL = "ja_JP.UTF-8"
ARF_R_HOME = "$CONDA_PREFIX/lib/R"
RENV_PATHS_CACHE = "$PIXI_PROJECT_ROOT/.pixi/renv-cache"
RENV_CONFIG_PPM_ENABLED = "FALSE"
RENV_CONFIG_PAK_ENABLED = "FALSE"
# Stan packages can exhaust memory when several C++ files compile at once.
MAKEFLAGS = "-j1"
