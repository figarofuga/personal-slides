[workspace]
name = "personal-slides"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tasks]
preview = "quarto preview"
render = "bash scripts/render-site.sh"

[dependencies]
python = ">=3.12.14,<3.13"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.3,<3"
polars = ">=1.44.2,<2"
statsmodels = ">=0.15.0,<0.16"
scipy = ">=1.18.1,<2"
scikit-learn = ">=1.9.1,<2"
matplotlib = ">=3.11.1,<4"
shap = ">=0.52.0,<0.53"
seaborn = ">=0.13.2,<0.14"
xgboost = ">=3.4.1,<4"
lightgbm = ">=4.7.0,<5"
econml = ">=0.17.0,<0.18"
causal-learn = ">=0.1.4.7,<0.2"
causalml = ">=0.15.4,<0.16"
scikit-survival = ">=0.28.0,<0.29"

# R本体
r = ">=4.5,<4.6"

# Jupyter / editor support
radian = ">=0.6.15,<0.7"
jedi = ">=0.20.0,<0.21"
ipykernel = ">=7.3.0,<8"
jupyter = ">=1.1.1,<2"
jupyter_core = ">=5.9.1,<6"
jupyter_client = ">=8.10.0,<9"
xeus-r = ">=0.11.2,<0.12"

# CmdStan / Stan / Bayesian modeling
cmdstan = ">=2.39.0,<3"
r-cmdstanr = ">=0.9.0,<0.10"
r-rstan = ">=2.32.7,<3"
r-stanheaders = ">=2.32.10,<3"
r-brms = ">=2.23.0,<3"
r-rstanarm = ">=2.32.2,<3"
r-loo = ">=2.10.1,<3"
r-bayesplot = ">=1.15.0,<2"
r-posterior = ">=1.7.0,<2"

# Tidyverse / modeling / causal inference
r-tidyverse = ">=2.0.0,<3"
r-tidymodels = ">=1.4.1,<2"
r-ggpubr = ">=1.0.0,<2"
r-tinyplot = ">=0.7.0,<0.8"
r-tinytable = ">=0.18.0,<0.19"
r-tableone = ">=0.13.2,<0.14"
r-gtsummary = ">=2.5.1,<3"
r-modelsummary = ">=2.6.0,<3"
r-marginaleffects = ">=1.0.0,<2"
r-hmisc = ">=5.2_6,<6"
r-rms = ">=8.1_1,<9"
r-weightit = ">=2.0.0,<3"
r-matchit = ">=4.7.2,<5"
r-superlearner = ">=2.0_41,<3"
r-tmle = ">=2.1.1,<3"
r-aer = ">=1.2_17,<2"
r-grf = ">=2.6.1,<3"
r-naniar = ">=1.1.0,<2"
r-mice = ">=3.19.0,<4"
r-ggmice = ">=0.1.1,<0.2"
r-cowplot = ">=1.2.0,<2"
r-patchwork = ">=1.3.2,<2"
r-dagitty = ">=0.3_4,<0.4"
r-easystats = ">=0.7.6,<0.8"
r-riskregression = ">=2026.3.11,<2027"

# R / Python bridge and R tooling
r-here = ">=1.0.2,<2"
r-reticulate = ">=1.47.0,<2"
r-targets = ">=1.12.0,<2"
r-plotly = ">=4.12.1,<5"
r-languageserver = ">=0.3.18,<0.4"
r-httpgd = ">=2.1.4,<3"
r-lintr = ">=3.4.0,<4"

# ローカルでpixi-build-rするrmsb
r-rmsb = { path = "vendor/rmsb" }
r-exclusiontable = { path = "vendor/ExclusionTable" }
r-forestploter = { path = "vendor/forestploter" }
quarto = ">=1.9.38,<2"

r-ggcube = { path = "vendor/ggcube" }
r-clarify = { path = "vendor/clarify" }
r-plotthis = { path = "vendor/plotthis" }
doubleml = ">=0.11.4,<0.12"
r-lme4 = ">=2.0_6,<3"
r-glmmtmb = ">=1.1.14,<2"
r-tmb = ">=1.9.23,<2"
r-litedown = ">=0.10,<0.11"
r-bonsai = ">=0.4.1,<0.5"
r-bootstrap = ">=2019.6,<2020"
r-diagrammer = ">=1.0.12,<2"
r-finalfit = ">=1.1.0,<2"
r-ggdag = ">=0.2.13,<0.3"
r-ggsurvfit = ">=1.2.1,<2"
r-gtextras = ">=0.6.2,<0.7"
r-kableextra = ">=1.4.1,<2"
r-lightgbm = ">=4.7.0,<5"
r-policytree = ">=1.2.5,<2"
r-rootsolve = ">=1.8.2.4,<2"
r-sessioninfo = ">=1.2.4,<2"
r-skimr = ">=2.2.2,<3"
r-xgboost = ">=3.4.1,<4"

r-simsurv = { path = "vendor/simsurv" }
conda = ">=26.7.2,<27"
pymc = ">=5.28.5,<6"
nutpie = ">=0.16.11,<0.17"
bambi = ">=0.17.2,<0.18"
arviz = ">=0.23.4,<0.24"
numpyro = ">=0.21.0,<0.22"
blackjax = ">=1.6.2,<2"
r-jsonlite = ">=2.0.0,<3"
r-rlang = ">=1.3.0,<2"
arf = ">=0.5.1,<0.6"
r-aipw = { path = "vendor/AIPW" }
r-dbarts = ">=0.9_33,<0.10"
r-stochtree = { path = "vendor/stochtree" }
r-dalex = ">=2.5.4,<3"
r-shapviz = ">=0.10.4,<0.11"
dalex = ">=1.7.0,<2"
r-kernelshap = ">=0.9.1,<0.10"
r-partykit = ">=1.2_29,<2"
deno = ">=2.4.5,<2.5"
r-sensemakr = ">=0.1.6,<0.2"
r-qreport = { path = "vendor/qreport" }
[activation.env]
RETICULATE_PYTHON = "$CONDA_PREFIX/bin/python"
RETICULATE_USE_MANAGED_VENV = "no"
PIXI_R_LIBS = "$CONDA_PREFIX/lib/R/library"
R_LIBS = "$PIXI_R_LIBS"
R_LIBS_USER = "$PIXI_R_LIBS"
JUPYTER_PATH = "$CONDA_PREFIX/share/jupyter"
QUARTO_DENO = "$CONDA_PREFIX/bin/deno"
QUARTO_SHARE_PATH = "$CONDA_PREFIX/share/quarto"
LANG = "ja_JP.UTF-8"
LC_ALL = "ja_JP.UTF-8"
ARF_R_HOME = "$CONDA_PREFIX/lib/R"
