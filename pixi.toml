[workspace]
name = "personal-slides"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tasks]
preview = "quarto preview"
render = "bash scripts/render-site.sh"

[dependencies]
python = ">=3.12.13,<3.13"
pandas = ">=3.0.3,<4"
numpy = ">=2.4.6,<3"
polars = ">=1.42.0,<2"
statsmodels = ">=0.14.6,<0.15"
scipy = ">=1.18.0,<2"
scikit-learn = ">=1.6.1,<2"
matplotlib = ">=3.11.0,<4"
seaborn = ">=0.13.2,<0.14"
xgboost = ">=3.2.0,<4"
lightgbm = ">=4.6.0,<5"
econml = ">=0.16.0,<0.17"
causal-learn = ">=0.1.4.7,<0.2"
causalml = ">=0.15.4,<0.16"
scikit-survival = ">=0.26.0,<0.27"

# R本体
r = ">=4.5,<4.6"

# Jupyter / editor support
radian = ">=0.6.15,<0.7"
jedi = ">=0.20.0,<0.21"
ipykernel = ">=7.3.0,<8"
jupyter = ">=1.1.1,<2"
jupyter_core = ">=5.9.1,<6"
jupyter_client = ">=8.9.1,<9"
xeus-r = ">=0.11.0,<0.12"

# CmdStan / Stan / Bayesian modeling
cmdstan = "2.39.*"
r-cmdstanr = "*"
r-rstan = ">=2.32,<2.33"
r-stanheaders = ">=2.32,<2.33"
r-brms = "*"
r-rstanarm = "*"
r-loo = "*"
r-bayesplot = "*"
r-posterior = "*"

# Tidyverse / modeling / causal inference
r-tidyverse = ">=2.0.0,<3"
r-tidymodels = ">=1.4.1,<2"
r-ggpubr = ">=0.6.3,<0.7"
r-tinyplot = ">=0.7.0,<0.8"
r-tinytable = ">=0.16.0,<0.17"
r-tableone = ">=0.13.2,<0.14"
r-gtsummary = ">=2.5.1,<3"
r-modelsummary = ">=2.6.0,<3"
r-marginaleffects = ">=0.32.0,<0.33"
r-hmisc = ">=5.2_6,<6"
r-rms = ">=8.1_1,<9"
r-weightit = ">=1.7.0,<2"
r-matchit = ">=4.7.2,<5"
r-tmle = ">=2.1.1,<3"
r-aer = ">=1.2_17,<2"
r-grf = ">=2.6.1,<3"
r-naniar = ">=1.1.0,<2"
r-mice = ">=3.19.0,<4"
r-ggmice = ">=0.1.1,<0.2"
r-cowplot = ">=1.2.0,<2"
r-patchwork = ">=1.3.2,<2"
r-dagitty = ">=0.3_4,<0.4"
r-easystats = ">=0.7.6,<0.8"
r-riskregression = ">=2026.3.11,<2027"

# R / Python bridge and R tooling
r-here = ">=1.0.2,<2"
r-reticulate = ">=1.46.0,<2"
r-plotly = ">=4.12.0,<5"
r-languageserver = ">=0.3.18,<0.4"
r-httpgd = ">=2.1.4,<3"
r-lintr = ">=3.3.0_1,<4"

# ローカルでpixi-build-rするrmsb
r-rmsb = { path = "vendor/rmsb" }
r-exclusiontable = { path = "vendor/ExclusionTable" }
r-forestploter = { path = "vendor/forestploter" }
r-glinternet = { path = "vendor/glinternet" }
r-findit = { path = "vendor/FindIt" }
quarto = ">=1.9.38,<2"

r-ggcube = { path = "vendor/ggcube" }
r-clarify = { path = "vendor/clarify" }
r-plotthis = { path = "vendor/plotthis" }
doubleml = ">=0.11.3,<0.12"
r-lme4 = ">=2.0_1,<3"
r-glmmtmb = ">=1.1.14,<2"
r-doubleml = { path = "vendor/DoubleML" }
r-tmb = "1.9.19.*"
r-litedown = ">=0.9,<0.10"
r-bonsai = ">=0.4.1,<0.5"
r-bootstrap = ">=2019.6,<2020"
r-diagrammer = ">=1.0.12,<2"
r-finalfit = ">=1.1.0,<2"
r-ggdag = ">=0.2.13,<0.3"
r-ggsurvfit = ">=1.2.0,<2"
r-gtextras = ">=0.6.2,<0.7"
r-kableextra = ">=1.4.1,<2"
r-lightgbm = ">=4.6.0,<5"
r-policytree = ">=1.2.4,<2"
r-rootsolve = ">=1.8.2.4,<2"
r-sessioninfo = ">=1.2.4,<2"
r-skimr = ">=2.2.2,<3"
r-xgboost = ">=3.3.0,<4"

r-simsurv = { path = "vendor/simsurv" }
conda = ">=26.5.3,<27"
pymc = ">=6.2.0,<7"
nutpie = ">=0.16.11,<0.17"
bambi = ">=0.19.0,<0.20"
arviz = ">=1.2.0,<2"
numpyro = ">=0.21.0,<0.22"
blackjax = ">=1.6.2,<2"
r-jsonlite = ">=2.0.0,<3"
r-rlang = ">=1.3.0,<2"
arf = ">=0.4.5,<0.5"
r-aipw = { path = "vendor/AIPW" }
r-dbarts = ">=0.9_33,<0.10"
[activation.env]
RETICULATE_PYTHON = "$CONDA_PREFIX/bin/python"
RETICULATE_USE_MANAGED_VENV = "no"
PIXI_R_LIBS = "$CONDA_PREFIX/lib/R/library"
R_LIBS = "$PIXI_R_LIBS"
R_LIBS_USER = "$PIXI_R_LIBS"
JUPYTER_PATH = "$CONDA_PREFIX/share/jupyter"
LANG = "ja_JP.UTF-8"
LC_ALL = "ja_JP.UTF-8"
ARF_R_HOME = "$CONDA_PREFIX/lib/R"
